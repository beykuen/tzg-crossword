<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="田字格填字">
</head>
<body>
<title>田字格填字</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a school manuscript sheet. 田字格 grid on the left (top in portrait),
   clue list on the right; red-pen marks for checking. */
:root {
  --paper: #f5f7f1;
  --sheet: #fffffc;
  --ink: #1d2721;
  --muted: #5c6b62;
  --grid: #3a8a5b;
  --grid-soft: #c3dccb;
  --red: #c4372c;
  --red-soft: #f8e1dd;
  --hl: #fdf0b5;
  --hl-strong: #f6d867;
  --given: #2f6f8f;
  --line: #d9e3dc;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
  --cs: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121815; --sheet: #19211d; --ink: #e5ece7; --muted: #9cb0a4;
    --grid: #6dbb8b; --grid-soft: #2e4a3b; --red: #ff7465; --red-soft: #3d2220;
    --hl: #3b3820; --hl-strong: #6a5e1e; --given: #7cc3e6; --line: #2c3a33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121815; --sheet: #19211d; --ink: #e5ece7; --muted: #9cb0a4;
  --grid: #6dbb8b; --grid-soft: #2e4a3b; --red: #ff7465; --red-soft: #3d2220;
  --hl: #3b3820; --hl-strong: #6a5e1e; --given: #7cc3e6; --line: #2c3a33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--paper); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
  -webkit-tap-highlight-color: transparent;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--hl-strong); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; margin: 0; letter-spacing: 0.06em; line-height: 1.1; }
.brand .sub { color: var(--muted); font-size: 14px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 2px; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
select {
  min-height: 44px; padding: 0 36px 0 12px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--sheet); appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat;
}
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--sheet); }
.seg button { min-height: 41px; padding: 0 14px; border: 0; background: transparent; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--grid); color: var(--sheet); font-weight: 700; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sheet); font-weight: 500; }
.btn.primary { background: var(--grid); border-color: var(--grid); color: var(--sheet); font-weight: 700; }
.btn.red { border-color: var(--red); color: var(--red); }
.btn:disabled { opacity: 0.5; cursor: default; }

main.game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 16px; align-items: start; }
@media (max-width: 900px) { main.game { grid-template-columns: minmax(0, 1fr); } }

.sheet { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }

.askbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1.5px dashed var(--grid-soft); }
.askclue { display: flex; gap: 10px; align-items: baseline; min-height: 2.2em; }
.askclue .tag { flex: none; font-family: var(--font-display); font-weight: 700; color: var(--sheet); background: var(--grid); border-radius: 8px; padding: 0 10px; font-size: 17px; }
.askclue .text { font-size: 19px; font-weight: 500; text-wrap: pretty; }
.askrow { display: flex; gap: 8px; flex-wrap: wrap; }
.askrow input {
  flex: 1 1 200px; min-width: 0; min-height: 48px; padding: 0 14px; border-radius: 10px;
  border: 2px solid var(--grid); background: var(--paper); font-family: var(--font-display); font-size: 24px; letter-spacing: 0.15em;
}
.askrow input::placeholder { color: var(--muted); opacity: 0.8; letter-spacing: 0.15em; }
.msg { min-height: 1.6em; font-size: 15px; color: var(--muted); }
.msg.err { color: var(--red); }
.msg.ok { color: var(--grid); font-weight: 500; }

.board-wrap { position: relative; display: flex; justify-content: center; overflow-x: auto; padding: 4px; }
.board { display: grid; grid-template-columns: repeat(var(--cols), var(--cs)); grid-auto-rows: var(--cs); gap: 0; touch-action: manipulation; }
.cell { position: relative; }
.cell.on {
  background: var(--sheet); border: 1.5px solid var(--grid); margin: -0.75px;
  display: grid; place-items: center; cursor: pointer;
  font-family: var(--font-display); font-size: calc(var(--cs) * 0.6); line-height: 1;
}
/* the dashed cross of a 田字格 */
.cell.on::before, .cell.on::after { content: ""; position: absolute; pointer-events: none; }
.cell.on::before { left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--grid-soft); }
.cell.on::after { top: 50%; left: 0; right: 0; border-top: 1px dashed var(--grid-soft); }
.cell.on.word { background: var(--hl); }
.cell.on.cur { background: var(--hl-strong); }
.cell .ch { position: relative; z-index: 1; }
.cell.given .ch { color: var(--given); }
.cell.revealed .ch { color: var(--red); }
.cell.wrong { background: var(--red-soft) !important; }
.cell.wrong .ch { color: var(--red); text-decoration: line-through; text-decoration-thickness: 2px; }
.cell .num { position: absolute; z-index: 2; top: 1px; left: 3px; font-family: var(--font-body); font-size: max(10px, calc(var(--cs) * 0.22)); line-height: 1; color: var(--muted); font-weight: 700; }

.stamp {
  position: absolute; right: 8px; top: 4px; z-index: 3; pointer-events: none;
  font-family: var(--font-display); font-weight: 700; color: var(--red); font-size: 40px; line-height: 1;
  border: 4px solid var(--red); border-radius: 50%; width: 96px; height: 96px; display: grid; place-items: center;
  transform: rotate(-14deg); opacity: 0.88; letter-spacing: 0.05em;
}
@media (prefers-reduced-motion: no-preference) { .stamp:not([hidden]) { animation: stamp 0.35s ease-out; } }
@keyframes stamp { from { transform: rotate(-14deg) scale(1.8); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: 0.88; } }

.result { margin-top: 14px; padding: 12px 14px; border: 1.5px solid var(--red); border-radius: 12px; background: var(--red-soft); display: grid; gap: 4px; }
.result .r-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--red); }
.result .r-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; font-variant-numeric: tabular-nums; }
.result .r-stats b { font-size: 18px; }
.result .r-note { font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1.5px dashed var(--grid-soft); align-items: center; }
.progress { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.clues { display: grid; gap: 14px; }
.clues h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 4px; letter-spacing: 0.1em; color: var(--grid); }
.clues ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.clues li button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 2.2em 1fr auto; gap: 6px; align-items: baseline;
  padding: 8px 8px; border: 0; border-radius: 8px; background: transparent; line-height: 1.5;
}
.clues li button:hover { background: var(--paper); }
.clues li button.active { background: var(--hl); }
.clues .n { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.clues .len { color: var(--muted); font-size: 13px; white-space: nowrap; }
.clues li.done .t { color: var(--muted); }
.clues li.done .len::before { content: "✓ "; color: var(--grid); font-weight: 700; }

.loading { padding: 48px 0; text-align: center; color: var(--muted); font-family: var(--font-display); font-size: 20px; }

/* custom word bank sheet */
.panel-back { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / 0.35); display: grid; place-items: start center; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
.panel { width: min(760px, 100%); background: var(--sheet); border-radius: 16px; border: 1.5px solid var(--line); padding: 20px; display: grid; gap: 16px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.panel h2 { font-family: var(--font-display); font-size: 26px; margin: 0; }
.panel h3 { font-size: 16px; margin: 0; }
.store-note { font-size: 14px; color: var(--muted); }
.form { display: grid; gap: 10px; }
.form input[type=text], .form textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); padding: 10px 12px; }
.form input[type=text] { min-height: 44px; }
.form textarea { min-height: 150px; resize: vertical; font-family: var(--font-display); font-size: 18px; line-height: 1.6; }
.hint { font-size: 13px; color: var(--muted); }
.errors { margin: 0; padding-left: 1.2em; color: var(--red); font-size: 14px; }
.custom-list { display: grid; gap: 14px; }
.custom-theme h4 { margin: 0 0 6px; font-size: 15px; color: var(--grid); }
.custom-theme ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.custom-theme li { display: grid; grid-template-columns: minmax(4.5em, auto) 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.custom-theme .w { font-family: var(--font-display); font-size: 19px; }
.custom-theme .c { min-width: 0; color: var(--muted); font-size: 14px; }
.del { min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 14px; }
.del.arm { border-color: var(--red); color: var(--red); font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>田字格填字</h1>
      <span class="sub">點格子，看線索，把詞填進去</span>
    </div>
    <div class="controls">
      <div class="field">
        <label for="theme">主題</label>
        <select id="theme"></select>
      </div>
      <div class="field">
        <label id="diffLabel">難度</label>
        <div class="seg" role="group" aria-labelledby="diffLabel" id="diff">
          <button type="button" data-d="easy" aria-pressed="false">簡單</button>
          <button type="button" data-d="mid" aria-pressed="true">中等</button>
          <button type="button" data-d="hard" aria-pressed="false">困難</button>
        </div>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="button" class="btn primary" id="newBtn">新題目</button>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="button" class="btn" id="bankBtn">自訂詞庫</button>
      </div>
    </div>
  </header>

  <main class="game">
    <section class="sheet" aria-label="題目">
      <div class="askbar">
        <div class="askclue" aria-live="polite"><span class="tag" id="askTag">－</span><span class="text" id="askText">點一個格子開始</span></div>
        <form class="askrow" id="askForm" autocomplete="off">
          <input id="answer" type="text" lang="zh-Hant" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="輸入答案">
          <button type="submit" class="btn primary">填入</button>
          <button type="button" class="btn" id="revealOne">看這題答案</button>
        </form>
        <div class="msg" id="msg"></div>
      </div>
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board"><div class="loading">出題中…</div></div>
        <div class="stamp" id="stamp" hidden>甲上</div>
      </div>
      <div class="result" id="result" hidden aria-live="polite">
        <div class="r-title" id="rTitle"></div>
        <div class="r-stats"><span>正確度 <b id="rAcc"></b></span><span>用時 <b id="rTime"></b></span><span>得分 <b id="rScore"></b></span></div>
        <div class="r-note">正確度 70 分＋速度 30 分。每格平均 20 秒內速度拿滿分。90 分以上甲上，75 分以上甲，60 分以上乙。</div>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="checkBtn">檢查</button>
        <button type="button" class="btn" id="clearBtn">擦掉重寫</button>
        <button type="button" class="btn red" id="revealAll">看全部答案</button>
        <span class="progress" id="progress"></span>
      </div>
    </section>

    <aside class="sheet clues" aria-label="線索">
      <div><h2>橫的</h2><ol id="acrossList"></ol></div>
      <div><h2>直的</h2><ol id="downList"></ol></div>
    </aside>
  </main>
</div>

<div class="panel-back" id="bankPanel" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="bankTitle">
    <div class="panel-head">
      <h2 id="bankTitle">自訂詞庫</h2>
      <button type="button" class="btn" id="bankClose">關閉</button>
    </div>
    <p class="store-note" id="storeNote">正在連線詞庫…</p>
    <form class="form" id="addForm">
      <h3>加入新詞</h3>
      <div class="field">
        <label for="addTheme">主題（選現有的，或打一個新名字）</label>
        <input type="text" id="addTheme" list="themeOptions" placeholder="例如：三年級國語" autocomplete="off">
        <datalist id="themeOptions"></datalist>
      </div>
      <div class="field">
        <label for="addLines">每行一個詞：答案｜線索</label>
        <textarea id="addLines" placeholder="蝴蝶｜翅膀漂亮、會採花蜜的昆蟲&#10;彩虹｜雨後天空出現的七色彎橋"></textarea>
      </div>
      <p class="hint">答案限 2 到 8 個中文字。線索裡不能出現答案的字，不然一看就知道答案。直線「|」、全形「｜」、冒號或逗號都可以當分隔。自己做的新主題至少要 6 個詞才能出題。</p>
      <div><button type="submit" class="btn primary" id="addBtn">加入詞庫</button></div>
      <div class="msg" id="addMsg"></div>
      <ul class="errors" id="addErrors"></ul>
    </form>
    <div class="custom-list" id="customList"></div>
  </section>

  bank.forEach((item, idx) => {
    [...item[0]].forEach((ch, i) => {
      if (!byChar.has(ch)) byChar.set(ch, []);
      byChar.get(ch).push([idx, i]);
    });
  });
  const t0 = Date.now();
  let best = null, tries = 0;
  while (Date.now() - t0 < budgetMs || !best) {
    const r = attempt(bank, byChar, N, rand);
    tries++;
    if (!best || score(r, N) > score(best, N)) best = r;
  }
  best.tries = tries;
  return best;
}

function score(r, N) {
  let cells = 0;
  for (const row of r.grid) for (const c of row) if (c) cells++;
  // Connector words (third field 'c') only exist to link the grid, so they count less.
  const conn = r.words.filter(w => w.conn).length;
  return (r.words.length - conn) * 6 + conn * 2 + cells;
}

function attempt(bank, byChar, N, rand) {
  const g = Array.from({ length: N }, () => Array(N).fill(null));
  const dirs = Array.from({ length: N }, () => Array.from({ length: N }, () => ''));
  const used = [];
  const usedIdx = new Set();
  // Seed with any random word centred on the grid. Restricting seeds to long
  // words starved banks whose 3-4 character words share few characters.
  let s = Math.floor(rand() * bank.length);
  if (bank[s][2] === 'c') s = Math.floor(rand() * bank.length);
  const sw = bank[s][0];
  const d0 = rand() < 0.5 ? 'A' : 'D';
  const mid = Math.floor(N / 2), off = Math.floor((N - sw.length) / 2);
  const r0 = d0 === 'A' ? mid : off, c0 = d0 === 'A' ? off : mid;
  put(g, dirs, sw, r0, c0, d0);
  used.push({ w: sw, clue: bank[s][1], r: r0, c: c0, d: d0, conn: bank[s][2] === 'c' });
  usedIdx.add(s);

  for (;;) {
    const cands = [];
    let bestX = 0;
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++) {
        const ch = g[r][c];
        if (!ch || dirs[r][c].length === 2) continue;
        const d = dirs[r][c] === 'A' ? 'D' : 'A';
        for (const [idx, i] of byChar.get(ch) || []) {
          if (usedIdx.has(idx)) continue;
          const w = bank[idx][0];
          // Skip words that contain, or sit inside, a word already on the grid
          // (e.g. 籃球 and 籃球場): such pairs feel repetitive to solve.
          if (used.some(u => u.w.includes(w) || w.includes(u.w))) continue;
          const sr = d === 'D' ? r - i : r, sc = d === 'A' ? c - i : c;
          const x = can(g, dirs, N, w, sr, sc, d);
          if (!x) continue;
          // Growth potential: how many unused words could later hook onto the
          // new letters. Two-character words otherwise become dead ends fast.
          let pot = 0;
          for (let k = 0; k < w.length; k++) {
            if (k === i) continue;
            for (const [j] of byChar.get(w[k]) || []) if (j !== idx && !usedIdx.has(j)) pot++;
          }
          const base = x * 6 + Math.min(pot, 8) + 0.5;
          cands.push([idx, sr, sc, d, bank[idx][2] === 'c' ? base * 0.55 : base]);
        }
      }
    if (!cands.length) break;
    // Weighted random pick: favours crossings and growth, keeps restarts varied.
    let total = 0;
    for (const k of cands) total += k[4] * k[4];
    let pick = rand() * total, chosen = cands[0];
    for (const k of cands) { pick -= k[4] * k[4]; if (pick <= 0) { chosen = k; break; } }
    const [idx, r, c, d] = chosen;
    const w = bank[idx][0];
    put(g, dirs, w, r, c, d);
    used.push({ w, clue: bank[idx][1], r, c, d, conn: bank[idx][2] === 'c' });
    usedIdx.add(idx);
  }
  return { grid: g, words: used };
}

function can(g, dirs, N, w, r, c, d) {
  const L = w.length;
  const dr = d === 'D' ? 1 : 0, dc = d === 'A' ? 1 : 0;
  const er = r + dr * (L - 1), ec = c + dc * (L - 1);
  if (r < 0 || c < 0 || er >= N || ec >= N) return 0;
  const pr = r - dr, pc = c - dc;
  if (pr >= 0 && pc >= 0 && g[pr][pc]) return 0;
  const nr = er + dr, nc = ec + dc;
  if (nr < N && nc < N && g[nr][nc]) return 0;
  let cross = 0;
  for (let i = 0; i < L; i++) {
    const rr = r + dr * i, cc = c + dc * i;
    const cur = g[rr][cc];
    if (cur) {
      if (cur !== w[i] || dirs[rr][cc].includes(d)) return 0;
      cross++;
    } else {
      // Empty cell: its side neighbours must be empty, or we'd create unintended words.
      const n1 = d === 'D' ? [rr, cc - 1] : [rr - 1, cc];
      const n2 = d === 'D' ? [rr, cc + 1] : [rr + 1, cc];
      for (const [a, b] of [n1, n2])
        if (a >= 0 && b >= 0 && a < N && b < N && g[a][b]) return 0;
    }
  }
  return cross > 0 && cross < L ? cross : 0;
}

function put(g, dirs, w, r, c, d) {
  for (let i = 0; i < w.length; i++) {
    const rr = r + (d === 'D' ? i : 0), cc = c + (d === 'A' ? i : 0);
    g[rr][cc] = w[i];
    dirs[rr][cc] += d;
  }
}




const N = 13;
const DIFF = { easy: 0.4, mid: 0.2, hard: 0 };
const MIN_WORDS = 6;
const $ = id => document.getElementById(id);

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ---------- custom word store: db when the viewer serves it, else this browser ---------- */
const store = {
  mode: 'local',      // 'db' | 'local'
  items: lsGet('tzg-custom') || [],   // [{id, theme, word, clue}]
  db: null,
  listeners: [],
  onChange(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(f => f()); },
  async add(item) {
    if (this.mode === 'db') { await this.db.collection('customWords').add({ ...item, addedAt: Date.now() }); return; }
    this.items.push({ id: 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ...item });
    lsSet('tzg-custom', this.items); this.emit();
  },
  async remove(id) {
    if (this.mode === 'db') { await this.db.collection('customWords').doc(id).delete(); return; }
    this.items = this.items.filter(x => x.id !== id);
    lsSet('tzg-custom', this.items); this.emit();
  },
};

async function connectDb() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { updateStoreNote(); return; }
  store.db = db; store.mode = 'db'; store.items = [];
  updateStoreNote();
  db.collection('customWords').onSnapshot(snap => {
    store.items = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(x => typeof x.word === 'string' && typeof x.clue === 'string' && typeof x.theme === 'string');
    store.emit();
  }, () => { updateStoreNote(true); });
}

function updateStoreNote(broken) {
  const el = $('storeNote');
  if (broken) el.textContent = '詞庫暫時連不上，重新開啟頁面再試一次。';
  else if (store.mode === 'db') el.textContent = '你加的詞存在這個遊戲的雲端詞庫裡，換一台裝置打開也看得到。';
  else el.textContent = '你加的詞只存在這台裝置的瀏覽器裡。清除瀏覽器資料就會不見。';
}

/* ---------- themes ---------- */
function themeBank(name) {
  const base = (BUILTIN[name] || []).slice();
  const seen = new Set(base.map(x => x[0]));
  for (const it of store.items) if (it.theme === name && !seen.has(it.word)) { base.push([it.word, it.clue]); seen.add(it.word); }
  return base;
}
function themeNames() {
  const names = Object.keys(BUILTIN);
  for (const it of store.items) if (!names.includes(it.theme)) names.push(it.theme);
  return names;
}
function renderThemeSelect() {
  const sel = $('theme'), cur = sel.value || (state && state.theme);
  sel.innerHTML = '';
  for (const n of themeNames()) {
    const count = themeBank(n).length;
    const o = document.createElement('option');
    o.value = n;
    o.textContent = count < MIN_WORDS ? `${n}（還差 ${MIN_WORDS - count} 個詞）` : n;
    o.disabled = count < MIN_WORDS;
    sel.appendChild(o);
  }
  if (themeNames().includes(cur)) sel.value = cur;
  const dl = $('themeOptions'); dl.innerHTML = '';
  for (const n of themeNames()) { const o = document.createElement('option'); o.value = n; dl.appendChild(o); }
}

/* ---------- puzzle state ---------- */
let state = lsGet('tzg-state') || null;   // {theme, diff, cols, rows, words:[{w,clue,r,c,d,n}], given:{}, entry:{}, revealed:{}}
let sel = { wi: -1, ci: -1 };             // selected word index, cell index within word
let checked = false;
const key = (r, c) => r + ',' + c;

function buildPuzzle(theme, diff) {
  const bank = themeBank(theme);
  const res = generate(bank, N, 1200);
  // Crop to the used area so cells can be as large as possible.
  let r0 = N, c0 = N, r1 = 0, c1 = 0;
  res.grid.forEach((row, r) => row.forEach((ch, c) => { if (ch) { r0 = Math.min(r0, r); r1 = Math.max(r1, r); c0 = Math.min(c0, c); c1 = Math.max(c1, c); } }));
  const words = res.words.map(w => ({ w: w.w, clue: w.clue, r: w.r - r0, c: w.c - c0, d: w.d }));
  // Number word starts in reading order; across and down from one cell share a number.
  const starts = [...new Set(words.map(w => key(w.r, w.c)))]
    .map(k => k.split(',').map(Number)).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const numOf = {}; starts.forEach(([r, c], i) => numOf[key(r, c)] = i + 1);
  words.forEach(w => w.n = numOf[key(w.r, w.c)]);
  const s = { theme, diff, rows: r1 - r0 + 1, cols: c1 - c0 + 1, words, given: {}, entry: {}, revealed: {}, done: false,
    elapsed: 0, wrongEver: {}, revealedAll: false, result: null };
  prefill(s, DIFF[diff]);
  return s;
}

function cellsOf(w) {
  return [...w.w].map((ch, i) => ({ r: w.r + (w.d === 'D' ? i : 0), c: w.c + (w.d === 'A' ? i : 0), ch }));
}
function answerMap(s) {
  const m = {};
  s.words.forEach(w => cellsOf(w).forEach(x => m[key(x.r, x.c)] = x.ch));
  return m;
}
function prefill(s, p) {
  if (!p) return;
  const ans = answerMap(s);
  const all = Object.keys(ans);
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  const target = Math.round(all.length * p);
  let n = 0;
  for (const k of all) {
    if (n >= target) break;
    s.given[k] = true;
    // Never give away a whole word.
    const whole = s.words.some(w => cellsOf(w).every(x => s.given[key(x.r, x.c)]));
    if (whole) { delete s.given[k]; continue; }
    n++;
  }
}

/* ---------- rendering ---------- */
function fitCells() {
  if (!state) return;
  const wrapW = $('boardWrap').clientWidth - 8;
  const cs = Math.max(30, Math.min(64, Math.floor(wrapW / state.cols)));
  document.documentElement.style.setProperty('--cs', cs + 'px');
}

function renderBoard() {
  const b = $('board'), ans = answerMap(state);
  b.style.setProperty('--cols', state.cols);
  b.innerHTML = '';
  const nums = {}; state.words.forEach(w => nums[key(w.r, w.c)] = w.n);
  const selCells = new Set(sel.wi >= 0 ? cellsOf(state.words[sel.wi]).map(x => key(x.r, x.c)) : []);
  const curKey = sel.wi >= 0 ? (() => { const x = cellsOf(state.words[sel.wi])[sel.ci]; return x ? key(x.r, x.c) : ''; })() : '';
  for (let r = 0; r < state.rows; r++) for (let c = 0; c < state.cols; c++) {
    const k = key(r, c), d = document.createElement('div');
    d.className = 'cell';
    if (ans[k]) {
      d.classList.add('on');
      d.dataset.k = k;
      d.setAttribute('role', 'button');
      const shown = state.given[k] ? ans[k] : (state.entry[k] || '');
      if (state.given[k]) d.classList.add('given');
      if (state.revealed[k]) d.classList.add('revealed');
      if (selCells.has(k)) d.classList.add('word');
      if (k === curKey) d.classList.add('cur');
      if (checked && !state.given[k] && state.entry[k] && state.entry[k] !== ans[k]) d.classList.add('wrong');
      d.setAttribute('aria-label', (shown ? shown : '空格'));
      if (nums[k]) { const n = document.createElement('span'); n.className = 'num'; n.textContent = nums[k]; d.appendChild(n); }
      const ch = document.createElement('span'); ch.className = 'ch'; ch.textContent = shown; d.appendChild(ch);
    }
    b.appendChild(d);
  }
  const res = state.done ? state.result : null;
  $('stamp').hidden = !(res && res.grade);
  if (res && res.grade) $('stamp').textContent = res.grade;
  renderResult();
  renderProgress();
}

function fmtTime(ms) {
  const s = Math.floor((ms || 0) / 1000);
  return `${Math.floor(s / 60)} 分 ${String(s % 60).padStart(2, '0')} 秒`;
}

// Accuracy (70) + speed (30). Pre-filled cells are excluded so every
// difficulty is judged by the same per-cell standard.
function gradePuzzle(s) {
  const ans = answerMap(s), keys = Object.keys(ans).filter(k => !s.given[k]);
  let pts = 0;
  for (const k of keys) pts += s.revealed[k] ? 0 : s.wrongEver[k] ? 0.5 : 1;
  const acc = keys.length ? pts / keys.length : 1;
  const perCell = keys.length ? s.elapsed / 1000 / keys.length : 0;
  const speed = perCell <= 20 ? 1 : perCell >= 60 ? 0 : (60 - perCell) / 40;
  const score = Math.round(acc * 70 + speed * 30);
  const grade = s.revealedAll ? '' : score >= 90 ? '甲上' : score >= 75 ? '甲' : score >= 60 ? '乙' : '丙';
  return { acc: Math.round(acc * 100), score, grade, elapsed: s.elapsed };
}

function renderResult() {
  const res = state && state.done ? state.result : null;
  $('result').hidden = !res;
  if (!res) return;
  $('rTitle').textContent = res.grade ? `完成！得到「${res.grade}」` : '完成了，下次再挑戰看看自己想出來';
  $('rAcc').textContent = res.acc + '%';
  $('rTime').textContent = fmtTime(res.elapsed);
  $('rScore').textContent = res.grade ? res.score : '－';
}

function wordFilled(w) { const ans = answerMap(state); return cellsOf(w).every(x => state.given[key(x.r, x.c)] || state.entry[key(x.r, x.c)]); }

function renderClues() {
  for (const [dir, id] of [['A', 'acrossList'], ['D', 'downList']]) {
    const ol = $(id); ol.innerHTML = '';
    state.words.map((w, i) => [w, i]).filter(([w]) => w.d === dir).sort((a, b) => a[0].n - b[0].n).forEach(([w, i]) => {
      const li = document.createElement('li');
      if (wordFilled(w)) li.className = 'done';
      const bt = document.createElement('button');
      bt.type = 'button';
      if (i === sel.wi) bt.classList.add('active');
      bt.innerHTML = `<span class="n">${w.n}</span><span class="t"></span><span class="len">${w.w.length} 字</span>`;
      bt.querySelector('.t').textContent = w.clue;
      bt.addEventListener('click', () => selectWord(i, 0, true));
      li.appendChild(bt); ol.appendChild(li);
    });
  }
}

function renderAsk() {
  const input = $('answer');
  if (sel.wi < 0) { $('askTag').textContent = '－'; $('askText').textContent = '點一個格子或一條線索開始'; input.placeholder = ''; return; }
  const w = state.words[sel.wi];
  $('askTag').textContent = `${w.n} ${w.d === 'A' ? '橫' : '直'}`;
  $('askText').textContent = w.clue;
  input.placeholder = cellsOf(w).map(x => { const k = key(x.r, x.c); return state.given[k] ? x.ch : (state.entry[k] || '□'); }).join('');
}

function renderProgress() {
  const ans = answerMap(state), keys = Object.keys(ans);
  const filled = keys.filter(k => state.given[k] || state.entry[k]).length;
  const t = Math.floor((state.elapsed || 0) / 1000);
  $('progress').textContent = `${state.theme}・已填 ${filled} / ${keys.length} 格・${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
}

function renderAll() { fitCells(); renderBoard(); renderClues(); renderAsk(); }
function save() { lsSet('tzg-state', state); }
function say(text, kind) { const m = $('msg'); m.textContent = text || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }

/* ---------- interaction ---------- */
function selectWord(wi, ci, focus) {
  sel = { wi, ci: ci || 0 };
  $('answer').value = '';
  say('');
  renderBoard(); renderClues(); renderAsk();
  if (focus) $('answer').focus({ preventScroll: true });
}

$('board').addEventListener('click', e => {
  const cell = e.target.closest('.cell.on'); if (!cell) return;
  const [r, c] = cell.dataset.k.split(',').map(Number);
  const hits = state.words.map((w, i) => [w, i]).filter(([w]) => cellsOf(w).some(x => x.r === r && x.c === c));
  if (!hits.length) return;
  // Tapping a crossing again flips between across and down.
  let pick = hits[0];
  if (hits.length > 1 && sel.wi === hits[0][1] && cellsOf(hits[0][0]).some((x, i) => i === sel.ci && x.r === r && x.c === c)) pick = hits[1];
  else if (hits.length > 1 && sel.wi === hits[1][1]) pick = hits[1];
  const [w, wi] = pick;
  const ci = cellsOf(w).findIndex(x => x.r === r && x.c === c);
  selectWord(wi, ci, true);
});

$('askForm').addEventListener('submit', e => {
  e.preventDefault();
  if (sel.wi < 0) { say('先點一個格子或一條線索。', 'err'); return; }
  const w = state.words[sel.wi], cells = cellsOf(w);
  const typed = [...$('answer').value.replace(/[\s　]/g, '')];
  if (!typed.length) { say(`請輸入 ${cells.length} 個字。`, 'err'); return; }
  if (typed.length !== cells.length) { say(`這題要填 ${cells.length} 個字，你填了 ${typed.length} 個。`, 'err'); return; }
  cells.forEach((x, i) => { const k = key(x.r, x.c); if (!state.given[k]) { state.entry[k] = typed[i]; delete state.revealed[k]; } });
  $('answer').value = '';
  afterChange();
  if (state.done) return;
  const next = nextOpenWord(sel.wi);
  if (next >= 0) { selectWord(next, 0, true); say('填好了，接著下一題。'); }
  else say('格子都填滿了，按「檢查」看看有沒有寫錯。', 'ok');
});

function nextOpenWord(from) {
  const order = state.words.map((w, i) => i).sort((a, b) => (state.words[a].d === state.words[b].d ? state.words[a].n - state.words[b].n : state.words[a].d === 'A' ? -1 : 1));
  const pos = order.indexOf(from);
  for (let s = 1; s <= order.length; s++) { const i = order[(pos + s) % order.length]; if (!wordFilled(state.words[i])) return i; }
  return -1;
}

function afterChange() {
  checked = false;
  const ans = answerMap(state);
  const allRight = Object.keys(ans).every(k => state.given[k] || state.entry[k] === ans[k]);
  const anyReveal = Object.keys(state.revealed).length > 0;
  if (allRight && !state.done) {
    state.done = true;
    state.result = gradePuzzle(state);
    say(anyReveal ? '全部完成！有幾題是看答案的，下次試試自己想出來。' : '全部答對！太厲害了。', 'ok');
  }
  save(); renderBoard(); renderClues(); renderAsk();
}

$('checkBtn').addEventListener('click', () => {
  const ans = answerMap(state), keys = Object.keys(ans).filter(k => !state.given[k]);
  const right = keys.filter(k => state.entry[k] === ans[k]).length;
  const wrong = keys.filter(k => state.entry[k] && state.entry[k] !== ans[k]).length;
  const blank = keys.filter(k => !state.entry[k]).length;
  // Remember every cell that was wrong at a check; fixing it later earns half credit.
  keys.forEach(k => { if (state.entry[k] && state.entry[k] !== ans[k] && !state.revealed[k]) state.wrongEver[k] = true; });
  save();
  checked = true; renderBoard();
  if (!wrong && !blank) { afterChange(); return; }
  const parts = [`對了 ${right} 格`];
  if (wrong) parts.push(`${wrong} 格要再想想（紅色的）`);
  if (blank) parts.push(`${blank} 格還沒填`);
  say(parts.join('，') + '。', wrong ? 'err' : '');
});

$('revealOne').addEventListener('click', () => {
  if (sel.wi < 0) { say('先點一個格子或一條線索。', 'err'); return; }
  cellsOf(state.words[sel.wi]).forEach(x => { const k = key(x.r, x.c); if (!state.given[k] && state.entry[k] !== x.ch) { state.entry[k] = x.ch; state.revealed[k] = true; } });
  afterChange();
  if (!state.done) say('紅色的字是看答案填的。');
});

$('revealAll').addEventListener('click', () => {
  const b = $('revealAll');
  if (!b.classList.contains('arm')) {
    b.classList.add('arm'); b.textContent = '再按一次確定';

    return;
  }
  b.classList.remove('arm'); b.textContent = '看全部答案';
  if (!state.done) state.revealedAll = true;
  const ans = answerMap(state);
  for (const k of Object.keys(ans)) if (!state.given[k] && state.entry[k] !== ans[k]) { state.entry[k] = ans[k]; state.revealed[k] = true; }
  afterChange();
});

$('clearBtn').addEventListener('click', () => {

function currentDiff() { return document.querySelector('#diff button[aria-pressed="true"]').dataset.d; }

function newPuzzle() {
  const theme = $('theme').value, diff = currentDiff();
  if (themeBank(theme).length < MIN_WORDS) { say(`「${theme}」的詞太少，至少要 ${MIN_WORDS} 個才能出題。`, 'err'); return; }
  $('board').innerHTML = '<div class="loading">出題中…</div>';
  $('stamp').hidden = true;
  say('');
  // Let the "出題中" frame paint before the generator occupies the main thread.
  setTimeout(() => {
    state = buildPuzzle(theme, diff);
    checked = false; sel = { wi: -1, ci: 0 };
    save();
    const first = nextOpenWord(-1);
    renderAll();
    if (first >= 0) selectWord(first, 0, false);
  }, 30);
}

window.addEventListener('resize', () => { if (state) { fitCells(); } });

/* ---------- timer: counts only while the puzzle is open on screen ---------- */
let tick = 0;
setInterval(() => {
  if (!state || state.done || document.visibilityState !== 'visible' || !$('bankPanel').hidden) return;
  if (!$('board').querySelector('.cell.on')) return;   // still generating
  state.elapsed = (state.elapsed || 0) + 1000;
  renderProgress();
  if (++tick % 5 === 0) save();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible' && state) save(); });

/* ---------- custom bank panel ---------- */
const HAN = /^[㐀-䶿一-鿿豈-﫿]{2,8}$/;
$('bankBtn').addEventListener('click', () => { $('bankPanel').hidden = false; renderCustomList(); $('addTheme').value = $('addTheme').value || $('theme').value; });
$('bankClose').addEventListener('click', () => { $('bankPanel').hidden = true; });
$('bankPanel').addEventListener('click', e => { if (e.target === $('bankPanel')) $('bankPanel').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('bankPanel').hidden) $('bankPanel').hidden = true; });

$('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const theme = $('addTheme').value.trim();
  const lines = $('addLines').value.split(/\n/).map(s => s.trim()).filter(Boolean);
  const errs = [];
  const am = $('addMsg');
  $('addErrors').innerHTML = '';
  if (!theme) { am.className = 'msg err'; am.textContent = '請先填主題名稱。'; return; }
  if (theme.length > 20) { am.className = 'msg err'; am.textContent = '主題名稱最多 20 個字。'; return; }
  if (!lines.length) { am.className = 'msg err'; am.textContent = '請在框框裡輸入至少一行「答案｜線索」。'; return; }
  const existing = new Set(themeBank(theme).map(x => x[0]));
  const good = [];
  lines.forEach((line, i) => {
    const m = line.match(/^(.+?)\s*[|｜:：,，\t]\s*(.+)$/);
    const at = `第 ${i + 1} 行`;
    if (!m) { errs.push(`${at}：找不到分隔符號，請寫成「答案｜線索」。`); return; }
    const word = m[1].replace(/\s/g, ''), clue = m[2].trim();
    if (!HAN.test(word)) { errs.push(`${at}：答案「${word}」要是 2 到 8 個中文字。`); return; }
    if (clue.length < 2 || clue.length > 60) { errs.push(`${at}：線索要 2 到 60 個字。`); return; }
    const leak = [...new Set([...word].filter(ch => clue.includes(ch)))];
    if (leak.length) { errs.push(`${at}：線索裡有答案的字「${leak.join('、')}」，請換個說法。`); return; }
    if (existing.has(word)) { errs.push(`${at}：「${word}」已經在這個主題裡了。`); return; }
    existing.add(word);
    good.push({ theme, word, clue });
  });
  $('addBtn').disabled = true;
  let saved = 0, failed = null;
  for (const it of good) {
    try { await store.add(it); saved++; }
    catch (err) { failed = err; break; }
  }
  $('addBtn').disabled = false;
  if (failed) {
    const code = failed && failed.code;
    errs.unshift(code === 'invalid_argument' ? '你沒有修改這個詞庫的權限。' : code === 'quota_exceeded' ? '詞庫已經滿了，先刪掉一些詞再加。' : '存檔失敗，請稍後再試。');
  }
  am.className = 'msg' + (saved ? ' ok' : errs.length ? ' err' : '');
  am.textContent = saved ? `已加入 ${saved} 個詞到「${theme}」。` : '沒有加入任何詞。';
  for (const t of errs) { const li = document.createElement('li'); li.textContent = t; $('addErrors').appendChild(li); }
  // Keep only the lines that need fixing in the box.
  if (saved) {
    const okWords = new Set(good.slice(0, saved).map(x => x.word));
    $('addLines').value = lines.filter(l => { const m = l.match(/^(.+?)\s*[|｜:：,，\t]/); return !(m && okWords.has(m[1].replace(/\s/g, ''))); }).join('\n');
  }
});

function renderCustomList() {
  const box = $('customList'); box.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = '你加過的詞'; box.appendChild(h);
  if (!store.items.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = '還沒有自訂的詞。在上面輸入後按「加入詞庫」，新詞就會出現在題目裡。'; box.appendChild(p); return; }
  const by = {};
  for (const it of store.items) (by[it.theme] = by[it.theme] || []).push(it);
  for (const [t, arr] of Object.entries(by)) {
    const sec = document.createElement('div'); sec.className = 'custom-theme';
    const h4 = document.createElement('h4'); h4.textContent = `${t}（${arr.length} 個）`; sec.appendChild(h4);
    const ul = document.createElement('ul');
    for (const it of arr) {
      const li = document.createElement('li');
      li.innerHTML = '<span class="w"></span><span class="c"></span><button type="button" class="del">刪除</button>';
      li.querySelector('.w').textContent = it.word;
      li.querySelector('.c').textContent = it.clue;
      const del = li.querySelector('.del');
      del.addEventListener('click', async () => {
        if (!del.classList.contains('arm')) { del.classList.add('arm'); del.textContent = '確定刪除'; setTimeout(() => { del.classList.remove('arm'); del.textContent = '刪除'; }, 3000); return; }
        del.disabled = true;
        try { await store.remove(it.id); } catch (err) { del.disabled = false; del.textContent = '刪除失敗'; }
      });
      ul.appendChild(li);
    }
    sec.appendChild(ul); box.appendChild(sec);
  }
}

store.onChange(() => { renderThemeSelect(); if (!$('bankPanel').hidden) renderCustomList(); });

/* ---------- boot ---------- */
(function boot() {
  renderThemeSelect();
  if (state && state.words && themeNames().includes(state.theme)) {
    // Puzzles saved before scoring existed lack these fields.
    state.elapsed = state.elapsed || 0; state.wrongEver = state.wrongEver || {};
    state.revealedAll = !!state.revealedAll;
    if (state.done && !state.result) state.result = gradePuzzle(state);
    $('theme').value = state.theme;
    document.querySelectorAll('#diff button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.d === state.diff)));
    renderAll();
    const first = nextOpenWord(-1);
    if (first >= 0) selectWord(first, 0, false);
    if (state.done) say('這題已經完成了，按「新題目」再玩一題。', 'ok');
  } else {
    state = null;
    $('theme').value = '食物';
    newPuzzle();
  }
  connectDb();
})();
</script>

</body>
</html>
